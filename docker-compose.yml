services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rustspeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rustspeak}
      POSTGRES_DB: ${POSTGRES_DB:-rustspeak}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/pg-healthcheck.sh:/scripts/pg-healthcheck.sh:ro
    healthcheck:
      test: [ "CMD", "/scripts/pg-healthcheck.sh" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: rustspeak:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rustspeak}:${POSTGRES_PASSWORD:-rustspeak}@postgres:5432/${POSTGRES_DB:-rustspeak}
      BIND_ADDR: 0.0.0.0:8443
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-32-byte-secret-value}
      INSECURE_DEV: "true"
      STATIC_DIR: /app/web/dist
      ICE_BIND_IP: ${ICE_BIND_IP:-0.0.0.0}
      STUN_URL: ${STUN_URL:-stun:stun.l.google.com:19302}
      ICE_UDP_PORT_MIN: ${ICE_UDP_PORT_MIN:-40000}
      ICE_UDP_PORT_MAX: ${ICE_UDP_PORT_MAX:-40100}
    expose:
      - "8443"
    ports:
      - "40000-40100:40000-40100/udp"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config

  adminer:
    image: adminer:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
