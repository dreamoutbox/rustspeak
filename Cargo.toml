[workspace]
resolver = "3"
members = [
    "crates/rs-common",
    "crates/rs-user",
    "crates/rs-text",
    "crates/rs-voice",
    "crates/rs-server",
]

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
rs-common = { path = "crates/rs-common" }
rs-text = { path = "crates/rs-text" }
rs-user = { path = "crates/rs-user" }
rs-voice = { path = "crates/rs-voice" }

anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
jsonwebtoken = "9"
rand = "0.8"
rtc = "=0.21.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
    "uuid",
    "chrono",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
webrtc = "=0.21.1"

[workspace.lints.clippy]
dbg_macro = "deny"

[workspace.metadata.release]
shared-version = true
consolidate-commits = true
pre-release-commit-message = "chore: Release {{version}}"
tag-name = "v{{version}}"
tag-prefix = ""
